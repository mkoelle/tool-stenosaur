<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stenosaur Virtual Camera</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --accent: #22c55e;
      --text: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .panel {
      width: min(90vw, 900px);
      padding: 32px;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
    }

    .badge {
      display: inline-block;
      margin-bottom: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3.5rem);
    }

    p {
      margin: 0 0 16px;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .status {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(96, 165, 250, 0.35);
      color: #bfdbfe;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <main class="panel">
    <div class="badge">Virtual webcam</div>
    <h1>Stenosaur demo feed</h1>
    <p>
      This page is intended to be captured by the virtual camera pipeline and sent into
      a Zoom meeting as a browser-based webcam source.
    </p>
    <p>
      It can be replaced with any HTML, dashboard, slide deck, or custom web experience.
    </p>
    <div class="status">Live feed ready</div>
  </main>
</body>

</html>
